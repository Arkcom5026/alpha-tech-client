name: ALDE Local Certification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: ALDE execution mode
        required: true
        default: SyncAndCertify
        type: choice
        options:
          - SyncAndCertify
          - Certify
  push:
    branches:
      - main
    paths:
      - '.github/workflows/alde-local-certify.yml'
      - 'tools/runner/invoke-alde-pipeline.ps1'
      - 'tools/runner/classify-alde-failures.ps1'
      - '.alde/trigger.json'

permissions:
  contents: write

concurrency:
  group: alde-local-certification
  cancel-in-progress: false

jobs:
  certify:
    name: Certify on Alpha-Tech local machine
    runs-on:
      - self-hosted
      - Windows
      - X64
      - alpha-tech-local
    timeout-minutes: 45
    env:
      ALDE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'SyncAndCertify' }}

    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run ALDE transcript-aware certification
        id: alde
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\runner\invoke-alde-pipeline.ps1" `
            -ClientPath 'D:\alpha-tech\client' `
            -ServerPath 'D:\alpha-tech\server' `
            -Mode "$env:ALDE_MODE" `
            -RequiredBranch 'main' `
            -EvidencePath "$env:GITHUB_WORKSPACE\alde-evidence"

      - name: Upload ALDE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alde-local-certification-${{ github.run_id }}
          path: |
            ${{ steps.alde.outputs.report_path }}
            ${{ steps.alde.outputs.metadata_path }}
            ${{ steps.alde.outputs.transcript_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish ALDE result bridge
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ALDE_STATUS: ${{ steps.alde.outputs.status }}
          ALDE_REPORT_PATH: ${{ steps.alde.outputs.report_path }}
          ALDE_METADATA_PATH: ${{ steps.alde.outputs.metadata_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Read-JsonFileSafely {
            param([string]$Path)
            if (-not $Path -or -not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              return $null
            }
            return Get-Content -LiteralPath $Path -Raw | ConvertFrom-Json
          }

          function Publish-ResultFile {
            param(
              [Parameter(Mandatory)][string]$Path,
              [Parameter(Mandatory)][string]$Content,
              [Parameter(Mandatory)][string]$Message
            )

            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $escapedPath = (($Path -split '/') | ForEach-Object { [uri]::EscapeDataString($_) }) -join '/'
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$escapedPath"
            $existingSha = $null

            try {
              $existing = Invoke-RestMethod -Method Get -Uri "${uri}?ref=alde-results" -Headers $headers
              $existingSha = $existing.sha
            }
            catch {
              $statusCode = $null
              if ($_.Exception.Response) {
                $statusCode = [int]$_.Exception.Response.StatusCode
              }
              if ($statusCode -ne 404) {
                throw
              }
            }

            $payload = [ordered]@{
              message = $Message
              branch = 'alde-results'
              content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($Content))
            }
            if ($existingSha) {
              $payload.sha = $existingSha
            }

            Invoke-RestMethod `
              -Method Put `
              -Uri $uri `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body ($payload | ConvertTo-Json -Depth 5) | Out-Null
          }

          $metadata = Read-JsonFileSafely -Path $env:ALDE_METADATA_PATH
          $report = Read-JsonFileSafely -Path $env:ALDE_REPORT_PATH
          $metadataStatus = if ($null -ne $metadata -and $metadata.PSObject.Properties['status']) { [string]$metadata.status } else { '' }
          $resolvedStatus = if ($env:ALDE_STATUS) { $env:ALDE_STATUS } elseif ($metadataStatus) { $metadataStatus } else { 'UNKNOWN' }

          $result = [ordered]@{
            schemaVersion = 2
            status = $resolvedStatus
            repository = $env:GITHUB_REPOSITORY
            sourceBranch = $env:GITHUB_REF_NAME
            sourceSha = $env:GITHUB_SHA
            eventName = $env:GITHUB_EVENT_NAME
            workflow = $env:GITHUB_WORKFLOW
            workflowRunId = [long]$env:GITHUB_RUN_ID
            workflowRunAttempt = [int]$env:GITHUB_RUN_ATTEMPT
            workflowRunUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
            runner = [ordered]@{
              name = $env:RUNNER_NAME
              os = $env:RUNNER_OS
              architecture = $env:RUNNER_ARCH
            }
            metadata = $metadata
            verificationReport = $report
          }

          $json = $result | ConvertTo-Json -Depth 30
          $historyPath = ".alde/history/run-$env:GITHUB_RUN_ID-attempt-$env:GITHUB_RUN_ATTEMPT.json"

          Publish-ResultFile `
            -Path $historyPath `
            -Content $json `
            -Message "chore(alde-results): publish run $env:GITHUB_RUN_ID attempt $env:GITHUB_RUN_ATTEMPT"

          Publish-ResultFile `
            -Path '.alde/latest-result.json' `
            -Content $json `
            -Message "chore(alde-results): update latest result to run $env:GITHUB_RUN_ID"

          Write-Host "ALDE result bridge published: status=$resolvedStatus run=$env:GITHUB_RUN_ID"
