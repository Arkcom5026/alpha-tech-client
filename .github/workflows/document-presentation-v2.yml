name: Document Presentation V2 Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/printing/presentation/**'
      - 'src/features/branch/documentHeader/documentHeaderConfig.js'
      - 'tests/document-presentation-v2-foundation.contract.test.js'
      - '.github/workflows/document-presentation-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Document Presentation V2 foundation contract
        run: node tests/document-presentation-v2-foundation.contract.test.js
      - name: Typecheck
        run: npm run typecheck
