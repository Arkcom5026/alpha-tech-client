name: Document Presentation V2 Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/printing/presentation/**'
      - 'src/features/branch/documentHeader/documentHeaderConfig.js'
      - 'src/features/quotation/presentation/**'
      - 'src/features/quotation/components/QuotationPresentationFooter.jsx'
      - 'src/features/quotation/pages/QuotationPrintPage.jsx'
      - 'src/features/deliveryNote/presentation/**'
      - 'src/features/deliveryNote/components/DeliveryNotePresentationFooter.jsx'
      - 'src/features/deliveryNote/pages/PrintDeliveryNotePage.jsx'
      - 'src/features/deliveryNote/print/workspace/components/DeliveryNotePrintShell.jsx'
      - 'src/features/customerReceipt/presentation/**'
      - 'src/features/customerReceipt/components/CustomerReceiptPresentationFooter.jsx'
      - 'src/features/customerReceipt/components/CustomerReceiptPrintLayout.jsx'
      - 'src/features/customerReceipt/components/CustomerReceiptA4Document.jsx'
      - 'src/features/purchaseOrder/presentation/**'
      - 'src/features/purchaseOrder/components/PurchaseOrderPresentationFooter.jsx'
      - 'src/features/purchaseOrder/api/purchaseOrderApi.js'
      - 'src/features/purchaseOrder/print/pages/PrintPurchaseOrderPage.jsx'
      - 'src/features/purchaseOrder/print/workspace/components/PurchaseOrderPrintShell.jsx'
      - 'src/features/sales/documents/workspace/api/saleDocumentWorkspaceApi.js'
      - 'src/features/sales/documents/workspace/index.js'
      - 'src/features/settings/components/QuotationPresentationSettingsCard.jsx'
      - 'src/features/settings/components/DeliveryNotePresentationSettingsCard.jsx'
      - 'src/features/settings/components/CustomerReceiptPresentationSettingsCard.jsx'
      - 'src/features/settings/components/PurchaseOrderPresentationSettingsCard.jsx'
      - 'src/features/settings/pages/DocumentFormatSettingsPage.jsx'
      - 'tests/document-presentation-v2-foundation.contract.test.js'
      - 'tests/quotation-document-presentation-wave1.contract.test.js'
      - 'tests/delivery-note-document-presentation-wave2.contract.test.js'
      - 'tests/customer-receipt-document-presentation-wave2.contract.test.js'
      - 'tests/purchase-order-document-presentation-wave3.contract.test.js'
      - '.github/workflows/document-presentation-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Document Presentation V2 foundation contract
        run: node tests/document-presentation-v2-foundation.contract.test.js
      - name: Run Quotation Document Presentation Wave 1 contract
        run: node tests/quotation-document-presentation-wave1.contract.test.js
      - name: Run Delivery Note Document Presentation Wave 2 contract
        run: node tests/delivery-note-document-presentation-wave2.contract.test.js
      - name: Run Customer Receipt Document Presentation Wave 2 contract
        run: node tests/customer-receipt-document-presentation-wave2.contract.test.js
      - name: Run Purchase Order Document Presentation Wave 3 contract
        run: node tests/purchase-order-document-presentation-wave3.contract.test.js
      - name: Typecheck
        run: npm run typecheck
