name: Frontend Mission Control v2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🛰️ ขนส่งและสแกนซอร์สโค้ดจาก Repository
      uses: actions/checkout@v4

    - name: ⚙️ จัดวางสแตนด์บายสภาวะแวดล้อม Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: 📦 บรรจุและติดตั้ง Packages ฝั่งหน้าบ้าน
      run: npm ci

    - name: Dependency security gate
      run: npm run audit:dependencies

    - name: UI modernization guard
      run: npm run guard:ui-modernization

    - name: 🧪 ตรวจสัญญา Sale Customer Search E2E Increment
      run: npm run test:sale-customer-search-e2e

    - name: 🧪 ตรวจสัญญา Canonical Public Storefront
      run: npm run test:canonical-storefront

    - name: 🧪 ตรวจสัญญาคู่มือภายในงานรับซ่อม
      run: npm run test:repair-in-app-help

    - name: 🧪 ตรวจสัญญาคู่มืองานเคลม
      run: npm run test:warranty-claim-help

    - name: 🧪 ตรวจสัญญาคู่มือรับสินค้าด่วน
      run: npm run test:quick-receipt-help

    - name: 🧪 ตรวจสัญญาคู่มือการขายหลัก
      run: npm run test:core-sales-help

    - name: 🧪 ตรวจสัญญาคู่มือคืนสินค้า
      run: npm run test:sale-return-help

    - name: 🧪 ตรวจสัญญาการกู้คืนคำสั่งยืนยันการขาย
      run: npm run test:sale-completion-recovery

    - name: 🧪 ตรวจสัญญา Sale Settlement Error Authority
      run: npm run test:sale-settlement-error-authority

    - name: 🧪 ตรวจสัญญาการแยกความรับผิดชอบ Sale History Runtime
      run: npm run test:sale-history-runtime-capability-separation

    - name: 🧪 ตรวจสัญญา Sale Settlement Runtime Capability
      run: npm run test:sale-settlement-runtime-capability

    - name: 🧪 ตรวจสัญญาการยุติ Sale Root Store History Authority
      run: npm run test:sale-root-store-history-authority-retirement

    - name: 🔐 ผูกเงื่อนไขความลับผ่านระบบกระจกเงาสะท้อน (Injecting Secrets)
      run: |
        echo "VITE_API_URL=https://api.saduaksabuy.com/api/v2/procurement" >> .env
        echo "VITE_KEY_CONNECTOR=${{ secrets.KEY_CONNECTOR }}" >> .env
        echo "VITE_KEY_LOGIC=${{ secrets.KEY_LOGIC }}" >> .env
        echo "VITE_KEY_API=${{ secrets.KEY_API }}" >> .env
        echo "VITE_KEY_PRISMA=${{ secrets.KEY_PRISMA }}" >> .env
        echo "VITE_KEY_ORCHESTRATOR=${{ secrets.KEY_ORCHESTRATOR }}" >> .env

    - name: 🏗️ รันคำสั่งคอมไพล์ประกอบร่างโปรเจกต์ (Production Build)
      run: npm run build
