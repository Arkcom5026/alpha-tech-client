name: Frontend Mission Control v2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🛰️ ขนส่งและสแกนซอร์สโค้ดจาก Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ⚙️ จัดวางสแตนด์บายสภาวะแวดล้อม Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: 📦 บรรจุและติดตั้ง Packages ฝั่งหน้าบ้าน
      run: npm ci

    - name: Dependency security gate
      run: npm run audit:dependencies

    - name: Release safety contract
      run: node tests/release-safety-foundation.contract.test.js

    - name: Canonical E2E authority cleanup contract
      run: node tests/canonical-e2e-authority-cleanup.contract.test.js

    - name: Observability incident detection contract
      run: node tests/observability-incident-detection.contract.test.js

    - name: Tax Closing handoff contract
      run: node tests/tax-closing-handoff.contract.test.js

    - name: Public Storefront customer journey contract
      run: node tests/public-storefront-customer-journey.contract.test.js

    - name: Sale receipt print reliability contract
      run: node tests/sale-receipt-print-reliability.contract.test.js

    - name: Partner Store operational readiness UI contract
      run: npx vitest run tests/partner-store-operational-readiness-ui-v2.contract.test.js

    - name: Home startup performance contracts
      run: npx vitest run tests/home-startup-performance.contract.test.js src/features/system/operational-status/operationalStatusBadge.contract.test.js

    - name: Auth initial bootstrap performance contract
      run: npx vitest run tests/auth-initial-bootstrap-performance.contract.test.js

    - name: UI modernization full-repository guard
      run: npm run guard:ui-modernization

    - name: UI modernization incremental guard
      run: node scripts/verify-ui-modernization.mjs --mode=diff

    - name: UI modernization hardening contract
      run: npx vitest run tests/ui-modernization-foundation.contract.test.js

    - name: Vite 8 production runtime chunking contract
      run: npx vitest run tests/vite8-production-runtime-chunking.contract.test.js

    - name: 🧪 ตรวจสัญญา Sale Customer Search E2E Increment
      run: npm run test:sale-customer-search-e2e

    - name: 🧪 ตรวจสัญญา Canonical Public Storefront
      run: npm run test:canonical-storefront

    - name: 🧪 ตรวจสัญญาคู่มือภายในงานรับซ่อม
      run: npm run test:repair-in-app-help

    - name: 🧪 ตรวจสัญญาคู่มือภายในงานเคลม
      run: npm run test:warranty-claim-help

    - name: 🧪 ตรวจสัญญาคู่มือรับสินค้าด่วน
      run: npm run test:quick-receipt-help

    - name: 🧪 ตรวจสัญญาการขายหลัก
      run: npm run test:core-sales-help

    - name: 🧪 ตรวจสัญญาคืนสินค้า
      run: npm run test:sale-return-help

    - name: 🧪 ตรวจสัญญาการกู้คืนคำสั่งยืนยันการขาย
      run: npm run test:sale-completion-recovery

    - name: 🧪 ตรวจสัญญา Sale Settlement Error Authority
      run: npm run test:sale-settlement-error-authority

    - name: 🧪 ตรวจสัญญาการแยกความรับผิดชอบ Sale History Runtime
      run: npm run test:sale-history-runtime-capability-separation

    - name: 🧪 ตรวจสัญญา Sale Settlement Runtime Capability
      run: npm run test:sale-settlement-runtime-capability

    - name: 🧪 ตรวจสัญญาการยุติ Sale Root Store History Authority
      run: npm run test:sale-root-store-history-authority-retirement

    - name: 🔐 ผูกเงื่อนไขความลับผ่านระบบกระจกเงาสะท้อน (Injecting Secrets)
      run: |
        echo "VITE_API_URL=https://api.saduaksabuy.com/api/v2/procurement" >> .env
        echo "VITE_KEY_CONNECTOR=${{ secrets.KEY_CONNECTOR }}" >> .env
        echo "VITE_KEY_LOGIC=${{ secrets.KEY_LOGIC }}" >> .env
        echo "VITE_KEY_API=${{ secrets.KEY_API }}" >> .env
        echo "VITE_KEY_PRISMA=${{ secrets.KEY_PRISMA }}" >> .env
        echo "VITE_KEY_ORCHESTRATOR=${{ secrets.KEY_ORCHESTRATOR }}" >> .env

    - name: Generate release provenance metadata
      run: node scripts/generate-release-metadata.mjs

    - name: 🏗️ รันคำสั่งคอมไพล์ประกอบร่างโปรเจกต์ (Production Build)
      run: npm run build
